<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChessGum — Admin Dashboard</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="chessgum_logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dashboard/dashboard.css" />
</head>
<body>

<!-- ═══════════════════════════════════════
     AUTH GATE
═══════════════════════════════════════ -->
<div id="authGate" class="auth-gate">
  <div class="auth-bg-grid"></div>
  <div class="auth-orb auth-orb-1"></div>
  <div class="auth-orb auth-orb-2"></div>

  <div class="auth-card">
    <div class="auth-logo">
      <img src="chessgum_logo.png" alt="ChessGum" />
      <div>
        <div class="auth-logo-name">ChessGum</div>
        <div class="auth-logo-sub">Internal Dashboard</div>
      </div>
    </div>

    <h1 class="auth-title">Welcome back 👋</h1>
    <p class="auth-sub">Enter your password to access the dashboard</p>

    <div class="auth-form">
      <div class="auth-input-wrap">
        <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input
          type="password"
          id="authPassword"
          class="auth-input"
          placeholder="Enter password"
          onkeydown="if(event.key==='Enter') handleLogin()"
          autocomplete="current-password"
        />
        <button class="auth-eye" id="authEye" onclick="toggleAuthEye()" type="button" aria-label="Toggle password visibility">
          <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div id="authError" class="auth-error" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Incorrect password. Please try again.
      </div>
      <button class="auth-btn" id="authBtn" onclick="handleLogin()" type="button">
        <span>Enter Dashboard</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════
     MAIN DASHBOARD APP
═══════════════════════════════════════ -->
<div id="dashApp" class="dash-app" style="display:none">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <img src="chessgum_logo.png" alt="ChessGum" class="sidebar-logo-img" />
        <div>
          <div class="sidebar-logo-name">ChessGum</div>
          <div class="sidebar-logo-sub">Admin Dashboard</div>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Main</div>

      <a href="#" class="sidebar-item active" data-page="overview" onclick="navigate('overview');return false;" id="nav-overview">
        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
        <span>Overview</span>
      </a>

      <a href="#" class="sidebar-item" data-page="leads" onclick="navigate('leads');return false;" id="nav-leads">
        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span>Leads</span>
        <span class="sidebar-badge" id="sidebarLeadCount">0</span>
      </a>

      <a href="#" class="sidebar-item" data-page="payments" onclick="navigate('payments');return false;" id="nav-payments">
        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="2" y="5" width="20" height="14" rx="2"/>
          <line x1="2" y1="10" x2="22" y2="10"/>
        </svg>
        <span>Payments</span>
      </a>

      <div class="sidebar-section-label" style="margin-top:8px">Analytics</div>

      <a href="#" class="sidebar-item" data-page="facebook" onclick="navigate('facebook');return false;" id="nav-facebook">
        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="currentColor" style="stroke:none">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
        <span>Facebook Ads</span>
      </a>

      <a href="#" class="sidebar-item" data-page="insights" onclick="navigate('insights');return false;" id="nav-insights">
        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <span>Insights</span>
      </a>

      <div class="sidebar-section-label" style="margin-top:8px">System</div>

      <a href="#" class="sidebar-item" data-page="settings" onclick="navigate('settings');return false;" id="nav-settings">
        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Settings</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar">CG</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">Admin</div>
          <div class="sidebar-user-role">ChessGum Owner</div>
        </div>
        <button class="sidebar-logout" onclick="handleLogout()" title="Logout" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ── SIDEBAR OVERLAY (mobile) ── -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <!-- ── MAIN CONTENT ── -->
  <main class="dash-main" id="dashMain">

    <!-- Top Header -->
    <header class="dash-header">
      <div class="dash-header-left">
        <button class="hamburger" id="hamburger" onclick="toggleSidebar()" type="button" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
        <div class="dash-page-info">
          <h1 class="dash-page-title" id="dashPageTitle">Overview</h1>
          <p class="dash-page-sub" id="dashPageSub">Your business at a glance</p>
        </div>
      </div>
      <div class="dash-header-right">
        <div class="dash-live-dot"><span></span>Live</div>
        <div class="dash-date-pill" id="dashDate"></div>
        <button class="dash-add-lead-btn" onclick="openAddLeadModal()" id="headerAddLeadBtn" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Lead
        </button>
      </div>
    </header>

    <!-- Page Content -->
    <div class="dash-content">
      <section id="page-overview"  class="dash-page"></section>
      <section id="page-leads"     class="dash-page" style="display:none"></section>
      <section id="page-payments"  class="dash-page" style="display:none"></section>
      <section id="page-facebook"  class="dash-page" style="display:none"></section>
      <section id="page-insights"  class="dash-page" style="display:none"></section>
      <section id="page-settings"  class="dash-page" style="display:none"></section>
    </div>
  </main>
</div>

<!-- ═══════════════════════════════════════
     LEAD DETAIL DRAWER
═══════════════════════════════════════ -->
<div id="leadDrawer" class="drawer-wrapper" style="display:none">
  <div class="drawer-overlay" onclick="closeDrawer()"></div>
  <div class="drawer-panel" id="drawerPanel">
    <!-- filled by JS -->
  </div>
</div>

<!-- ═══════════════════════════════════════
     ADD LEAD MODAL
═══════════════════════════════════════ -->
<div id="addLeadModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeAddLeadModal()">
  <div class="modal-card" id="addLeadModalCard">
    <!-- filled by JS -->
  </div>
</div>

<!-- ═══════════════════════════════════════
     LOST REASON MODAL
═══════════════════════════════════════ -->
<div id="lostModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeLostModal()">
  <div class="modal-card modal-card--sm" id="lostModalCard">
    <!-- filled by JS -->
  </div>
</div>

<!-- ═══════════════════════════════════════
     TOAST NOTIFICATIONS
═══════════════════════════════════════ -->
<div id="toastContainer" class="toast-container"></div>

<!-- ═══════════════════════════════════════
     SCRIPTS
═══════════════════════════════════════ -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="dashboard/app.js"></script>
</body>
</html>
